<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Energy Forecast{% endblock %} · Energy Consumption Forecasting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.27.0/plotly.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">
                <span class="brand-mark">⚡</span>
                <span class="brand-text">EnergyForecast</span>
            </div>
            <nav class="nav">
                <a href="{{ url_for('main.dashboard') }}" class="nav-link {{ 'active' if request.endpoint == 'main.dashboard' }}">
                    <span class="nav-icon">▦</span> Dashboard
                </a>
                <a href="{{ url_for('forecast.forecast_page') }}" class="nav-link {{ 'active' if request.endpoint == 'forecast.forecast_page' }}">
                    <span class="nav-icon">📈</span> Forecast
                </a>
                <a href="{{ url_for('upload.upload_page') }}" class="nav-link {{ 'active' if request.endpoint == 'upload.upload_page' }}">
                    <span class="nav-icon">⬆</span> Dataset Upload
                </a>
                <a href="{{ url_for('analytics.analytics_page') }}" class="nav-link {{ 'active' if request.endpoint == 'analytics.analytics_page' }}">
                    <span class="nav-icon">◈</span> Energy Analytics
                </a>
                <a href="{{ url_for('analytics.anomalies_page') }}" class="nav-link {{ 'active' if request.endpoint == 'analytics.anomalies_page' }}">
                    <span class="nav-icon">⚠</span> Anomaly Detection
                </a>
                <a href="{{ url_for('history.history_page') }}" class="nav-link {{ 'active' if request.endpoint == 'history.history_page' }}">
                    <span class="nav-icon">↺</span> Forecast History
                </a>
                <a href="{{ url_for('main.model_performance') }}" class="nav-link {{ 'active' if request.endpoint == 'main.model_performance' }}">
                    <span class="nav-icon">◎</span> Model Performance
                </a>
                <a href="{{ url_for('main.about') }}" class="nav-link {{ 'active' if request.endpoint == 'main.about' }}">
                    <span class="nav-icon">ℹ</span> About
                </a>
            </nav>
        </aside>

        <div class="main-column">
            <header class="topbar">
                <h1 class="page-title">{% block page_title %}Dashboard{% endblock %}</h1>
                <div class="topbar-right">
                    <span class="badge badge-neutral" id="dataset-badge">{% block dataset_badge %}{% endblock %}</span>
                </div>
            </header>
            <main class="content">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/charts.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
